name: Test save redirector
description: Restore, format, build, test, and verify the locked C# helper on Windows.

runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
      with:
        global-json-file: global.json
        cache: true
        cache-dependency-path: helpers/**/packages.lock.json
    - shell: pwsh
      run: dotnet restore ModDebugPilot.slnx --locked-mode
    - shell: pwsh
      run: dotnet format ModDebugPilot.slnx --no-restore --verify-no-changes
    - shell: pwsh
      run: dotnet build ModDebugPilot.slnx --configuration Release --no-restore --warnaserror
    - shell: pwsh
      run: >-
        dotnet run --project helpers/ModDebugPilot.SaveRedirector.Tests
        --configuration Release --no-build
    - shell: pwsh
      run: |
        $built = (Get-FileHash -Algorithm SHA256 helpers/ModDebugPilot.SaveRedirector/bin/Release/netstandard2.1/com.aoirint.ModDebugPilot.SaveRedirector.dll).Hash
        $embedded = (Get-FileHash -Algorithm SHA256 src/mod_debug_pilot/assets/ModDebugPilot.SaveRedirector.dll).Hash
        if ($built -ne $embedded) {
          throw "Embedded save redirector differs from the locked Release build."
        }
