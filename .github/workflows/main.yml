name: Main

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out integrated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run source checks
        uses: ./.github/actions/check-python-flet-source
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out integrated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run source tests
        uses: ./.github/actions/test-python-flet-source
  build-windows:
    needs: [check, test]
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Check out integrated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: toolchain
        shell: pwsh
        run: |
          $versions = @(Get-Content .python-version)
          if ($versions.Count -ne 1 -or [string]::IsNullOrWhiteSpace($versions[0])) {
            throw ".python-version must select exactly one Python version."
          }
          "python_version=$($versions[0].Trim())" >> $env:GITHUB_OUTPUT
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: ${{ steps.toolchain.outputs.python_version }}
          version: "0.12.3"
      - shell: pwsh
        run: uv lock --check
      - shell: pwsh
        run: uv sync --locked --all-groups
      - shell: pwsh
        run: uv build
      - name: Build Windows app
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: uv run --locked flet build windows --no-rich-output --yes
      - name: Verify packaged Flet runtime parity
        id: flet-parity
        shell: pwsh
        run: |
          $version = @'
          from importlib.metadata import distributions, version
          from pathlib import Path

          import yaml

          expected = version("flet-cli")
          packaged = {
              distribution.metadata["Name"].lower().replace("_", "-"): distribution.version
              for distribution in distributions(path=["build/windows/site-packages"])
              if distribution.metadata["Name"]
          }
          for name in ("flet", "flet-desktop", "flet-web"):
              actual = packaged.get(name)
              if actual != expected:
                  raise SystemExit(
                      f"Packaged {name} version {actual!r} does not match Flet CLI {expected}."
                  )

          flutter_lock = yaml.safe_load(Path("build/flutter/pubspec.lock").read_text(encoding="utf-8"))
          flutter_version = str(flutter_lock["packages"]["flet"]["version"])
          if flutter_version != expected:
              raise SystemExit(
                  f"Flutter Flet version {flutter_version} does not match Flet CLI {expected}."
              )
          print(expected)
          '@ | uv run --locked python -
          if ($LASTEXITCODE -ne 0) {
            throw 'Packaged Flet runtime parity verification failed.'
          }
          "version=$($version.Trim())" >> $env:GITHUB_OUTPUT
      - name: Smoke-test packaged Windows app
        shell: pwsh
        run: |
          $smokeRoot = Join-Path $env:RUNNER_TEMP 'mod-debug-pilot-smoke'
          $env:FLET_APP_STORAGE_DATA = Join-Path $smokeRoot 'data'
          $env:FLET_APP_STORAGE_TEMP = Join-Path $smokeRoot 'temp'
          $env:FLET_APP_CONSOLE = Join-Path $smokeRoot 'console.log'
          New-Item -ItemType Directory -Force $env:FLET_APP_STORAGE_DATA | Out-Null
          New-Item -ItemType Directory -Force $env:FLET_APP_STORAGE_TEMP | Out-Null

          $process = Start-Process build/windows/mod-debug-pilot.exe -PassThru
          try {
            $deadline = [DateTimeOffset]::UtcNow.AddSeconds(30)
            $ready = $false
            while ([DateTimeOffset]::UtcNow -lt $deadline) {
              $process.Refresh()
              if ($process.HasExited) {
                throw "Packaged app exited before startup completed with code $($process.ExitCode)."
              }
              if ($process.MainWindowTitle -eq 'ModDebugPilot Agent') {
                $ready = $true
                break
              }
              Start-Sleep -Milliseconds 250
            }
            if (-not $ready) {
              throw "Packaged app did not mount its initial Flet page within 30 seconds. Last title: '$($process.MainWindowTitle)'."
            }
          } catch {
            if (Test-Path $env:FLET_APP_CONSOLE) {
              Write-Host 'Packaged app console log:'
              Get-Content $env:FLET_APP_CONSOLE
            }
            throw
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }
      - name: Inspect packaged Python and Windows archives
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $lockPath = 'src/mod_debug_pilot/assets/save_redirect.lock.json'
          $lock = Get-Content $lockPath -Raw | ConvertFrom-Json
          if (
            $lock.repository -ne 'https://github.com/aoirint/SaveRedirect' -or
            $lock.file -ne 'com.aoirint.SaveRedirect.dll' -or
            $lock.plugin_guid -ne 'com.aoirint.SaveRedirect' -or
            $lock.environment_variable -ne 'SAVE_REDIRECT_ROOT' -or
            $lock.ready_marker -ne '[SAVEREDIRECT] ready'
          ) {
            throw 'SaveRedirect provenance lock has an unexpected contract.'
          }
          $expected = $lock.sha256.ToUpperInvariant()
          $local = (Get-FileHash -Algorithm SHA256 src/mod_debug_pilot/assets/com.aoirint.SaveRedirect.dll).Hash
          if ($local -ne $expected) {
            throw 'SaveRedirect DLL differs from its provenance lock.'
          }
          $archives = @(
            Get-ChildItem dist -Filter *.whl -File
            Get-Item build/windows/data/flutter_assets/app/app.zip
          )
          foreach ($archive in $archives) {
            $zip = [IO.Compression.ZipFile]::OpenRead($archive.FullName)
            try {
              $entries = @($zip.Entries | ForEach-Object FullName)
              if ($entries | Where-Object { $_ -match '(^|/)\.\.(/|$)' -or $_ -match '^(?:[A-Za-z]:|/)' }) {
                throw "Unsafe archive path found in $($archive.Name)."
              }
              if ($entries | Where-Object {
                $_ -match '(^|/)(\.git|\.env)(/|$)' -or
                $_ -match '^(?:tests?|mod_debug_pilot/tests?)/'
              }) {
                throw "Repository development or secret-shaped path found in $($archive.Name)."
              }
              $dll = $zip.Entries | Where-Object FullName -eq 'mod_debug_pilot/assets/com.aoirint.SaveRedirect.dll'
              $embeddedLock = $zip.Entries | Where-Object FullName -eq 'mod_debug_pilot/assets/save_redirect.lock.json'
              if ($null -eq $dll -or $null -eq $embeddedLock) {
                throw "Embedded SaveRedirect dependency or lock missing from $($archive.Name)."
              }
              $stream = $dll.Open()
              try {
                $sha = [Security.Cryptography.SHA256]::Create()
                try {
                  $actual = [Convert]::ToHexString($sha.ComputeHash($stream))
                } finally {
                  $sha.Dispose()
                }
              } finally {
                $stream.Dispose()
              }
              if ($actual -ne $expected) {
                throw "Embedded SaveRedirect dependency differs in $($archive.Name)."
              }
              $reader = [IO.StreamReader]::new($embeddedLock.Open())
              try {
                $embeddedLockText = $reader.ReadToEnd()
              } finally {
                $reader.Dispose()
              }
              if ($embeddedLockText.Trim() -ne (Get-Content $lockPath -Raw).Trim()) {
                throw "Embedded SaveRedirect provenance lock differs in $($archive.Name)."
              }
            } finally {
              $zip.Dispose()
            }
          }
      - id: manifest
        shell: pwsh
        env:
          PACKAGED_FLET_VERSION: ${{ steps.flet-parity.outputs.version }}
        run: |
          $files = @(
            Get-ChildItem dist -File
            Get-Item build/windows/mod-debug-pilot.exe
            Get-Item build/windows/data/flutter_assets/app/app.zip
          ) | ForEach-Object {
            [PSCustomObject]@{
              path = $_.FullName.Substring($env:GITHUB_WORKSPACE.Length + 1).Replace('\', '/')
              sha256 = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash
              bytes = $_.Length
            }
          }
          $manifest = [PSCustomObject]@{
            source_commit = $env:GITHUB_SHA
            uv_version = (& uv --version)
            flet_version = $env:PACKAGED_FLET_VERSION
            files = $files
          }
          $manifest | ConvertTo-Json -Depth 3 | Set-Content -Encoding utf8 ci-artifacts.json
          Get-Content ci-artifacts.json | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mod-debug-pilot-${{ github.sha }}
          path: |
            dist/
            build/windows/
            ci-artifacts.json
          if-no-files-found: error
          retention-days: 14
