name: CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Windows quality gate
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version-file: .python-version
          version: "0.11.21"

      - name: Install locked .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: helpers/**/packages.lock.json

      - name: Verify lockfile
        run: uv lock --check

      - name: Synchronize exact environment
        run: uv sync --locked --all-groups

      - name: Lint Python
        run: uv run --locked ruff check .

      - name: Check Python formatting
        run: uv run --locked ruff format --check .

      - name: Type-check Python
        run: uv run --locked mypy src tests

      - name: Test with full coverage
        run: uv run --locked pytest

      - name: Restore locked save redirector dependencies
        run: dotnet restore ModDebugPilot.slnx --locked-mode

      - name: Check save redirector formatting
        run: dotnet format ModDebugPilot.slnx --no-restore --verify-no-changes

      - name: Build save redirector with warnings as errors
        run: dotnet build ModDebugPilot.slnx --configuration Release --no-restore --warnaserror

      - name: Test save path confinement
        run: >-
          dotnet run --project helpers/ModDebugPilot.SaveRedirector.Tests
          --configuration Release --no-build

      - name: Verify embedded save redirector
        shell: pwsh
        run: |
          $built = (Get-FileHash -Algorithm SHA256 helpers/ModDebugPilot.SaveRedirector/bin/Release/netstandard2.1/com.aoirint.ModDebugPilot.SaveRedirector.dll).Hash
          $embedded = (Get-FileHash -Algorithm SHA256 src/mod_debug_pilot/assets/ModDebugPilot.SaveRedirector.dll).Hash
          if ($built -ne $embedded) {
            throw "Embedded save redirector differs from the locked Release build."
          }

      - name: Build source and wheel distributions
        run: uv build
