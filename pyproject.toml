[project]
name = "mod-debug-pilot"
version = "0.1.0.dev0"
description = "Safe, reproducible desktop automation for game mod debugging"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "ModDebugPilot contributors" },
]
dependencies = [
    "aiohttp>=3.12,<4",
    "cryptography>=48.0.1,<49",
    "flet[desktop]>=0.85,<0.87",
    "flet-web>=0.85,<0.87",
    "pillow>=11.3,<13",
    "pyyaml>=6.0.2,<7",
    "uvicorn[standard]>=0.35,<1",
]

[project.urls]
Documentation = "https://github.com/aoirint/mod-debug-pilot/tree/main/docs"
Repository = "https://github.com/aoirint/mod-debug-pilot"

[project.gui-scripts]
moddebugpilot = "mod_debug_pilot.__main__:main"
moddebugpilot-agent = "mod_debug_pilot.agent_main:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "flet-cli>=0.85,<0.86",
    "mypy>=1.17,<2",
    "pytest>=8.4,<10",
    "pytest-cov>=6.2,<8",
    "ruff>=0.12,<0.15",
    "types-pyyaml>=6.0.12,<7",
]

[tool.uv]
exclude-newer = "P7D"

[tool.hatch.build.targets.wheel]
packages = ["src/mod_debug_pilot"]

[tool.flet.app]
path = "src"
module = "main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = [
    "E",
    "W",
    "F",
    "FBT",
    "I",
    "ANN",
    "ARG",
    "ASYNC",
    "B",
    "C4",
    "C90",
    "COM",
    "D",
    "DTZ",
    "ERA",
    "FLY",
    "G",
    "ICN",
    "LOG",
    "N",
    "PERF",
    "PIE",
    "PL",
    "PLR0917",
    "PT",
    "PTH",
    "RET",
    "RUF",
    "S",
    "SIM",
    "SLF",
    "T20",
    "TRY",
    "UP",
]

ignore = [
    "COM812", # Ruff formatter owns trailing comma layout.
    "D203",   # Select D211: no blank line before class docstrings.
    "D213",   # Select D212: summary starts on the first line.
]

[tool.ruff.lint.pylint]
max-positional-args = 0

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101", # Pytest assertions are the test oracle.
]
"src/mod_debug_pilot/domain/remote.py" = [
    "PLR2004", # Protocol bounds are clearer beside the fields they constrain.
    "TRY003",  # Validation messages are part of the user-facing wire contract.
]
"src/mod_debug_pilot/infrastructure/agent_runtime.py" = [
    "PLR0913", # Runtime adapters are explicit constructor dependencies.
    "PLR2004", # Resource limits are local to their guarded operating-system effect.
    "TRY003",  # Recovery failures require precise operator-facing messages.
    "TRY301",  # Transaction bodies deliberately raise into one rollback boundary.
]
"src/mod_debug_pilot/infrastructure/profiles.py" = [
    "PLR2004", # Archive and protocol bounds are intentionally visible at each check.
    "TRY003",  # Import errors are bounded messages returned to the UI.
    "TRY300",  # Successful extraction returns inside the rollback scope.
    "TRY301",  # Archive validation failures deliberately enter one cleanup boundary.
]
"src/mod_debug_pilot/infrastructure/remote_api.py" = [
    "PLR2004", # HTTP status and size limits are protocol constants.
    "TRY003",  # Remote errors are deliberately stable client-facing messages.
    "TRY301",  # Route validation raises into the route's bounded error response.
]
"src/mod_debug_pilot/infrastructure/security.py" = [
    "PLR0913", # Every signed-request component remains an explicit argument.
    "PLR2004", # Cryptographic encoding sizes are meaningful at each validation point.
    "TRY003",  # Authentication errors intentionally avoid low-level exception details.
    "TRY301",  # Store parsing raises into one generic identity-error boundary.
]
"src/mod_debug_pilot/infrastructure/web_host.py" = [
    "TRY003",  # Lifecycle messages are displayed directly in the native Agent UI.
]
"src/mod_debug_pilot/ui/agent_app.py" = [
    "TRY003",  # UI action errors are concise operator guidance.
]
"src/mod_debug_pilot/ui/web_controller.py" = [
    "TRY003",  # UI action errors are concise controller guidance.
]

[tool.mypy]
files = ["src", "tests"]
strict = true
warn_unreachable = true
warn_unused_configs = true
show_error_code_links = true

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "-ra",
    "--cov=mod_debug_pilot",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=100",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source_pkgs = ["mod_debug_pilot"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
