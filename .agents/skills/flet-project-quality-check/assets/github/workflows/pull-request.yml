name: Pull Request

on:
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Merge-queue commits are immutable; cancel only superseded pull-request runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-slim
    timeout-minutes: 15

    steps:
      - name: Check out proposed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Flet source lint
        uses: ./.github/actions/check-python-flet-source

  test:
    name: Test
    runs-on: ubuntu-slim
    timeout-minutes: 15

    steps:
      - name: Check out proposed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Flet source tests
        uses: ./.github/actions/test-python-flet-source
