name: Pull Request

on:
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Merge-queue commits are immutable; cancel only superseded pull-request runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-slim
    timeout-minutes: 15

    steps:
      - name: Check out proposed source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Run Flet source lint
        uses: ./.github/actions/lint-source

  test:
    name: Test
    runs-on: ubuntu-slim
    timeout-minutes: 15

    steps:
      - name: Check out proposed source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Run Flet source tests
        uses: ./.github/actions/test-source
