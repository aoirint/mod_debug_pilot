name: Main

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-slim
    timeout-minutes: 15

    steps:
      - name: Check out integrated source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Run Flet source lint
        uses: ./.github/actions/lint-source

  test:
    name: Test
    runs-on: ubuntu-slim
    timeout-minutes: 15

    steps:
      - name: Check out integrated source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Run Flet source tests
        uses: ./.github/actions/test-source

  # Add plan/build/release only after target and publication contracts are
  # evidenced. Build must directly need checks, test, and any required plan job.
