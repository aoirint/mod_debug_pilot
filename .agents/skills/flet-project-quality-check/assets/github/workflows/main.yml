name: Main

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check
    runs-on: ubuntu-slim
    timeout-minutes: 15

    steps:
      - name: Check out integrated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Flet source lint
        uses: ./.github/actions/check-python-flet-source

  test:
    name: Test
    runs-on: ubuntu-slim
    timeout-minutes: 15

    steps:
      - name: Check out integrated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Flet source tests
        uses: ./.github/actions/test-python-flet-source

  # Add plan/build/release only after target and publication contracts are
  # evidenced. Build must directly need checks, test, and any required plan job.
