name: Check Flet source
description: Run workflow, Python, type, and Markdown source checks.

runs:
  using: composite
  steps:
    - name: Set up reviewed APM CLI
      uses: microsoft/apm-action@d723bb64ed70c135bbaf87d126b721dd2dae0439 # v1.10.0
      with:
        apm-version: "0.28.0"
        setup-only: "true"

    - name: Audit APM deployment
      shell: bash
      run: apm audit --ci

    - name: Install workflow validation tools
      id: workflow-tools
      uses: ./.github/actions/install-workflow-tools

    - name: Lint GitHub Actions syntax
      shell: bash
      run: actionlint -color

    - name: Verify immutable GitHub Actions pins
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: pinact run --check --min-age 7

    - name: Set up locked Python environment
      id: setup
      uses: ./.github/actions/setup-python-locked

    - name: Check Python formatting
      shell: bash
      run: uv run --locked ruff format --check .

    - name: Lint Python source
      shell: bash
      run: uv run --locked ruff check .

    - name: Type-check Python source
      shell: bash
      run: uv run --locked mypy src tests

    - name: Lint Markdown source
      uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
      with:
        config: .markdownlint-cli2.yaml
        globs: "**/*.md"

    # setup-uv owns its runner cache; remove only the action-created project environment.
    - name: Remove Python dependencies
      if: always() && steps.setup.outputs.environment-owned == 'true'
      shell: bash
      run: rm -rf .venv

    - name: Remove workflow validation tools
      if: ${{ always() && steps.workflow-tools.outputs.installation-directory != '' }}
      shell: bash
      env:
        WORKFLOW_TOOLS_DIRECTORY: ${{ steps.workflow-tools.outputs.installation-directory }}
      run: rm -rf -- "$WORKFLOW_TOOLS_DIRECTORY"
